springdoc:
  swagger-ui.path: /openapi/swagger-ui.html
  api-docs.path: /openapi/v3/api-docs
  packagesToScan: se.magnus.microservices.composite.incident
  pathsToMatch: /**
  cache.disabled: true

server.forward-headers-strategy: framework

api:

  common:
    version: 1.0.0
    title: Incident Composite API
    description: API for incident, device, and alert composition in the smart-city platform.
    termsOfService: Terms of service for the smart-city incident composite API
    license: Apache 2.0
    licenseUrl: https://www.apache.org/licenses/LICENSE-2.0

    externalDocDesc: Project documentation
    externalDocUrl: https://example.com/docs
    contact:
      name: Mia Nedeljković
      url: https://example.com
      email: mia@example.com

  responseCodes:
    ok.description: OK
    badRequest.description: Bad Request, invalid format of the request. See response message for more information
    notFound.description: Not found, the specified id does not exist
    unprocessableEntity.description: Unprocessable entity, input parameters caused the processing to fail. See response message for more information

  incident-composite:

    get-composite-incident:
      description: Returns a composite view of the specified incident id
      notes: |
        # Normal response
        If the requested incident id is found the method will return information regarding:
        1. Incident information
        1. Alerts
        1. Devices
        1. Service Addresses\n(technical information regarding the addresses of the microservices that created the response)

        # Expected partial and error responses
        1. If no incident information is found, a **404 - Not Found** error will be returned
        1. If no Devices or Alerts are found for an incident, a partial response will be returned

    create-composite-incident:
      description: Creates a composite incident
      notes: |
        # Normal response
        The composite incident information posted to the API will be split up and stored as separate incident, device, and alert entities.

        # Expected error responses
        1. If an incident with the same incidentId as specified in the posted information already exists,
           an **422 - Unprocessable Entity** error with a "duplicate key" error message will be returned

    delete-composite-incident:
      description: Deletes a incident composite
      notes: |
        # Normal response
        Entities for incident information, Devices and Alerts related to the specified incidentId will be deleted.
        The implementation of the delete method is idempotent, i.e. it can be called several times with the same response.

        This means that a delete request of a non-existing incident will return **200 Ok**.

server.port: 7000
server.error.include-message: always

spring.application.name: incident-composite

app.eureka-server: localhost

eureka:
  client:
    serviceUrl:
      defaultZone: http://${app.eureka-server}:8761/eureka/
    initialInstanceInfoReplicationIntervalSeconds: 5
    registryFetchIntervalSeconds: 5
  instance:
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 5

resilience4j.circuitbreaker.instances.incidentService:
  slidingWindowType: COUNT_BASED
  slidingWindowSize: 5
  minimumNumberOfCalls: 5
  failureRateThreshold: 50
  waitDurationInOpenState: 10s
  permittedNumberOfCallsInHalfOpenState: 1
  automaticTransitionFromOpenToHalfOpenEnabled: true

spring.cloud.stream:
  defaultBinder: rabbit
  default.contentType: application/json
  bindings:
    incidents-out-0:
      destination: incidents
      producer:
        required-groups: auditGroup
    devices-out-0:
      destination: devices
      producer:
        required-groups: auditGroup
    alerts-out-0:
      destination: alerts
      producer:
        required-groups: auditGroup

spring.cloud.stream.kafka.binder:
  brokers: 127.0.0.1
  defaultBrokerPort: 9092

spring.rabbitmq:
  host: 127.0.0.1
  port: 5672
  username: guest
  password: guest

logging:
  level:
    root: INFO
    se.magnus: DEBUG

management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"
---
spring.config.activate.on-profile: docker

server.port: 8080

app.eureka-server: eureka

spring.rabbitmq.host: rabbitmq

spring.cloud.stream.kafka.binder.brokers: kafka

---
spring.config.activate.on-profile: streaming_partitioned

spring.cloud.stream.bindings.incidents-out-0.producer:
  partition-key-expression: headers['partitionKey']
  partition-count: 2

spring.cloud.stream.bindings.devices-out-0.producer:
  partition-key-expression: headers['partitionKey']
  partition-count: 2

spring.cloud.stream.bindings.alerts-out-0.producer:
  partition-key-expression: headers['partitionKey']
  partition-count: 2

---
spring.config.activate.on-profile: kafka

management.health.rabbit.enabled: false
spring.cloud.stream.defaultBinder: kafka
spring.kafka.bootstrap-servers: kafka:9092
spring.cloud.stream.kafka.binder.replication-factor: 1
